[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eprdating"
dynamic = ["version"]
description = "Open ESR dating of tooth enamel in Python: EPR and HPGe gamma spectra, dose rates with one-group beta attenuation, EU/LU/US-ESR/CSUS-ESR ages with Monte Carlo uncertainties; validated against ROSY, DATA and published ages."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Miguel Enrique Gámez López", email = "megamezl@unal.edu.co" },
  { name = "Carol Jiseth Ospina Umaña" },
  { name = "Juan Sebastián Castro Millán" },
  { name = "Ovidio Amado Almanza Montero" },
]
maintainers = [{ name = "Miguel Enrique Gámez López", email = "megamezl@unal.edu.co" }]
keywords = ["ESR dating", "EPR", "geochronology", "tooth enamel", "dose rate", "US-ESR", "gamma spectrometry", "trapped charge dating"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# EPRAYA brings JAX, numba, ipywidgets, tkinter... keep it opt-in.
spectra = ["epraya>=0.1.41"]
plot = ["matplotlib>=3.7"]
# interactive interface for Jupyter and Colab (both come with Colab)
gui = ["ipywidgets>=7.6", "matplotlib>=3.7"]
# Canberra .cnf, ORTEC .spc and IEC 61455 gamma spectra
gamma-formats = ["becquerel>=0.7"]
dev = ["pytest>=7", "pytest-cov", "ruff", "matplotlib>=3.7", "ipywidgets>=7.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/MiguelGamezL/EPRdating"
Issues = "https://github.com/MiguelGamezL/EPRdating/issues"
"EPRAYA" = "https://github.com/eprayadev/EPRAYA"

[tool.hatch.version]
path = "src/eprdating/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eprdating"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "validation: reproduces published ages (needs case data filled in)",
  "epraya: needs the optional EPRAYA backend",
]

[tool.ruff]
line-length = 110
src = ["src"]
